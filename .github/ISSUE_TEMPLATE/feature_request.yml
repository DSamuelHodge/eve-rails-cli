name: Feature request
description: Suggest a new command, convention, integration, or workflow.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Eve Rails CLI do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other designs or workarounds considered.
  - type: textarea
    id: notes
    attributes:
      label: Additional Context
