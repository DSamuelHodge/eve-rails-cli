name: Bug report
description: Report broken behavior, regressions, or confusing output.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, manifest snippets, or files needed to reproduce.
      placeholder: |
        cargo run -- doctor --all
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: eve-rails-cli 0.1.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, Node version, Eve version.
