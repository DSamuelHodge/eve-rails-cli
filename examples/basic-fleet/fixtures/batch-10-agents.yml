defaults:
  model: openai/gpt-5.5
  owner: agent-platform
  channels: [web]
  evals: [standard, tone, tool-selection]
  approvals: on-risk

shared:
  tools:
    - search_customers
    - create_ticket
    - lookup_policy
  skills:
    - triage_customer_issue
    - summarize_thread
  memory:
    - customer_profile

agents:
  - name: support
    version: 1.0.0
    responsibility: Resolve customer support requests.
    tools: { search_customers: 1.0.0, create_ticket: 1.0.0, lookup_policy: 1.0.0 }
    skills: { triage_customer_issue: 1.0.0, summarize_thread: 1.0.1 }
    approvals: { create_ticket: on-risk }
    memory: { customer_profile: 1.0.0 }

  - name: billing
    version: 1.0.0
    responsibility: Answer billing questions and prepare refund requests.
    tools: { search_customers: 1.0.0, lookup_policy: 1.0.0, prepare_refund: 1.0.0 }
    skills: { handle_refund: 1.0.0 }
    approvals: { prepare_refund: required }
    memory: { customer_profile: 1.0.0 }

  - name: onboarding
    version: 1.0.0
    responsibility: Guide new customers through setup.
    tools: { search_customers: 1.0.0, create_ticket: 1.0.0, lookup_policy: 1.0.0 }
    skills: { triage_customer_issue: 1.0.0, summarize_thread: 1.0.1 }
    approvals: { create_ticket: on-risk }
    memory: { customer_profile: 1.0.0 }

  - name: retention
    version: 1.0.0
    responsibility: Identify retention risks and propose save actions.
    tools: { search_customers: 1.0.0, create_ticket: 1.0.0, lookup_policy: 1.0.0 }
    skills: { triage_customer_issue: 1.0.0, summarize_thread: 1.0.1 }
    approvals: { create_ticket: on-risk }
    memory: { customer_profile: 1.0.0 }

  - name: research
    version: 1.0.0
    responsibility: Gather account context for operators.
    tools: { search_customers: 1.0.0, lookup_policy: 1.0.0 }
    skills: { summarize_thread: 1.0.1 }
    memory: { customer_profile: 1.0.0 }

  - name: quality
    version: 1.0.0
    responsibility: Review support interactions for quality signals.
    tools: { search_customers: 1.0.0, lookup_policy: 1.0.0 }
    skills: { summarize_thread: 1.0.1 }
    memory: { customer_profile: 1.0.0 }

  - name: escalation
    version: 1.0.0
    responsibility: Prepare escalation packets for human teams.
    tools: { search_customers: 1.0.0, create_ticket: 1.0.0, lookup_policy: 1.0.0 }
    skills: { triage_customer_issue: 1.0.0, summarize_thread: 1.0.1 }
    approvals: { create_ticket: on-risk }
    memory: { customer_profile: 1.0.0 }

  - name: operations
    version: 1.0.0
    responsibility: Summarize operational trends from customer issues.
    tools: { search_customers: 1.0.0, lookup_policy: 1.0.0 }
    skills: { summarize_thread: 1.0.1 }
    memory: { customer_profile: 1.0.0 }

  - name: compliance
    version: 1.0.0
    responsibility: Check customer workflows against policy.
    tools: { search_customers: 1.0.0, lookup_policy: 1.0.0 }
    skills: { summarize_thread: 1.0.1 }
    memory: { customer_profile: 1.0.0 }

  - name: enablement
    version: 1.0.0
    responsibility: Draft enablement notes from support patterns.
    tools: { search_customers: 1.0.0, lookup_policy: 1.0.0 }
    skills: { summarize_thread: 1.0.1 }
    memory: { customer_profile: 1.0.0 }
