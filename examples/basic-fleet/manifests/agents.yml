defaults:
  model: openai/gpt-5.5
  owner: agent-platform
  channels: [web]
  schedules: []
  evals: [standard, tone, tool-selection]
  approvals: on-risk

shared:
  tools:
    - search_customers
    - create_ticket
    - lookup_policy
  skills:
    - triage_customer_issue
    - summarize_thread
  memory:
    - customer_profile
  schedules:
    - weekday_triage

agents:
  - name: support
    version: 1.0.0
    responsibility: Resolve customer support requests.
    tools:
      search_customers: 1.0.0
      create_ticket: 1.0.0
      lookup_policy: 1.0.0
    skills:
      triage_customer_issue: 1.0.0
      summarize_thread: 1.0.0
    subagents: [policy_checker]
    channels: [slack]
    schedules: [weekday_triage]
    approvals:
      create_ticket: on-risk
    memory:
      customer_profile: 1.0.0

  - name: billing
    version: 1.0.0
    responsibility: Answer billing questions and prepare refund requests.
    tools:
      search_customers: 1.0.0
      lookup_policy: 1.0.0
      prepare_refund: 1.0.0
    skills:
      handle_refund: 1.0.0
    approvals:
      prepare_refund: required
    memory:
      customer_profile: 1.0.0
